name: Verify public evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/verify_public_artifacts.py
      - run: python -m unittest discover -s code_sample -p "test_*.py"
